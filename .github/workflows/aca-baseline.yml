name: ACA baseline configuration

on:
  pull_request:
    paths:
      - "deploy/azure/**"
      - "compose*.yaml"
      - ".env"
      - "src/flagd/**"
      - "src/otel-collector/**"
      - ".github/workflows/aca-baseline.yml"
      - "README.md"
      - ".gitignore"
  push:
    paths:
      - "deploy/azure/**"
      - "compose*.yaml"
      - ".env"
      - "src/flagd/**"
      - "src/otel-collector/**"
      - ".github/workflows/aca-baseline.yml"
      - "README.md"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install configuration parser
        run: python -m pip install -r deploy/azure/requirements.txt
      - name: Validate deployment and telemetry gates
        run: python -m unittest discover -s deploy/azure -p 'test_*.py' -v
      - name: Compile infrastructure without deploying
        run: az bicep build --file deploy/azure/main.bicep
      - name: Lint public runbooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install markdownlint README.md deploy/azure/*.md
      - name: Parse PowerShell examples without executing them
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem deploy/azure -Filter *.md) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            # Extract fenced PowerShell examples for syntax parsing, never execution.
            foreach ($block in [regex]::Matches($text, '(?s)```powershell\s*\n(.*?)```')) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseInput(
                $block.Groups[1].Value, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count) { throw "$($file.Name): $($errors.Message -join '; ')" }
            }
          }
